name: scan

on:
  schedule:
    # Watchlist: every 10 minutes, at off-minutes. GitHub delays jobs that start
    # at :00, :15, :30 and :45 the most, so those are avoided.
    - cron: "3,13,23,33,43,53 * * * *"
    # Discovery: weekly, Mondays 08:07 UTC. Uses several search calls, so it
    # stays slow on purpose.
    - cron: "7 8 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "watchlist, discovery or all"
        default: "all"

permissions:
  contents: write          # commit data/seen.json back to the repo
  issues: write            # only used if NOTIFY_GH_ISSUE is turned on

# One run at a time. A run that starts while another is going waits instead of
# racing it, and only the newest waiting run is kept.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 8 * * 1" ]; then
            echo "value=discovery" >> "$GITHUB_OUTPUT"
          else
            echo "value=watchlist" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scanner
        run: python scan.py
        env:
          MODE: ${{ steps.mode.outputs.value }}
          GH_SCAN_TOKEN: ${{ secrets.GH_SCAN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The repo is public, so leave this unset unless you want alerts
          # visible to everyone. Set the variable to "1" to turn it on.
          NOTIFY_GH_ISSUE: ${{ vars.NOTIFY_GH_ISSUE }}
          WORKFLOW_TOKEN: ${{ github.token }}

      - name: Save seen items (only if changed)
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/seen.json
          if git diff --staged --quiet; then
            echo "No state change, nothing to commit."
          else
            git commit -m "update seen items [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push failed, retry $i"; sleep 3
            done
          fi
